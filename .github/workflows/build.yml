name: Build Demineur N0120

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer les outils
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make
          
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compiler
        run: make clean && make build

      - name: Recuperer le fichier NWA
        uses: actions/upload-artifact@v4
        with:
          name: demineur-n0120
          path: output/app.nwa
